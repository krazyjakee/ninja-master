[package]
name = "ninja-master-native"
version = "0.1.4"
edition = "2024"
publish = false
license = "MIT"
readme = "../README.md"
repository = "https://github.com/krazyjakee/ninja-master"
description = "Native PC port of Shinobi III: Return of the Ninja Master; requires a user-supplied US, EU or JP ROM"
keywords = ["game", "shinobi", "genesis", "native-port"]
categories = ["games"]

[features]
default = ["desktop"]
desktop = ["dep:sdl2", "dep:imgui", "dep:glow"]

[dependencies]
png = "=0.17.16"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
zip = { version = "=6.0.0", default-features = false, features = ["deflate-flate2"] }
imgui = { version = "=0.12.0", optional = true }
glow = { version = "=0.17.0", optional = true }
sdl2 = { version = "=0.38.0", optional = true }
lewton = "=0.10.2"
hound = "=3.5.1"

[target.'cfg(target_os = "macos")'.dependencies]
# Link the original SDL2 framework supplied by the macOS build.
sdl2 = { version = "=0.38.0", optional = true, features = ["use_mac_framework"] }

# Keep debug builds responsive during gameplay.
[profile.dev]
opt-level = 1
